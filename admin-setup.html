<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https: http:; object-src 'none'; base-uri 'none'"><title>راه‌اندازی مدیر مدرسه</title><style>body{font-family:Tahoma,sans-serif;background:#f3f6ff;color:#14213d;margin:0;padding:20px}.card{max-width:600px;margin:5vh auto;background:white;border:1px solid #dce5f7;border-radius:20px;padding:24px;box-shadow:0 15px 45px #1746c822}h1{color:#1746c8}label{display:block;font-size:12px;font-weight:bold;margin:13px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d6e0f4;border-radius:10px;font:inherit}button{margin-top:16px;background:#1746c8;color:#fff;border:0;border-radius:10px;padding:13px 16px;font-weight:bold;cursor:pointer}.msg{white-space:pre-wrap;background:#f5f7ff;border-radius:10px;padding:12px;margin-top:12px;line-height:1.8}.note{font-size:12px;line-height:1.9;color:#64748b}</style></head><body><main class="card"><h1>راه‌اندازی اولیه مدرسه</h1><p class="note">این صفحه فقط برای ساخت اولین مدیر استفاده می‌شود. آن را روی HTTPS باز کنید و کلید راه‌اندازی را از متغیر محیطی ADMIN_SETUP_KEY سرور وارد کنید. بعد از راه‌اندازی، کلید را از محیط سرور حذف/تعویض کنید و این صفحه را عمومی نگذارید.</p><label>آدرس API سرور</label><input id="api" placeholder="https://your-api.example.com" dir="ltr"><label>کلید راه‌اندازی (ADMIN_SETUP_KEY)</label><input id="key" type="password" autocomplete="off"><label>نام مدرسه</label><input id="school" placeholder="نام مدرسه"><label>نام کاربری مدیر</label><input id="user" autocomplete="username"><label>رمز عبور مدیر (حداقل ۱۰ نویسه)</label><input id="pass" type="password" autocomplete="new-password"><button onclick="setup()">ساخت مدرسه و حساب مدیر</button><div class="msg" id="msg">اطلاعات را تکمیل کنید.</div></main><script>async function setup(){const api=document.getElementById('api').value.trim().replace(/\/$/,'');const msg=document.getElementById('msg');if(!api||!document.getElementById('key').value||!document.getElementById('school').value.trim()||!document.getElementById('user').value.trim()||document.getElementById('pass').value.length<10){msg.textContent='همه فیلدها را تکمیل کنید؛ رمز مدیر حداقل ۱۰ نویسه باشد.';return}try{msg.textContent='در حال راه‌اندازی...';const r=await fetch(api+'/api/admin/setup',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Setup-Key':document.getElementById('key').value},body:JSON.stringify({schoolName:document.getElementById('school').value.trim(),username:document.getElementById('user').value.trim(),password:document.getElementById('pass').value})});const d=await r.json();if(!r.ok)throw Error(d.message||d.error||('HTTP '+r.status));msg.textContent='راه‌اندازی موفق شد.\nنام مدرسه: '+d.school.name+'\nنام کاربری مدیر: '+d.admin.username+'\nکد عضویت معلمان: '+d.school.joinCode+'\n\nاین کد را فقط به معلمان همین مدرسه بدهید. اکنون از admin.html وارد شوید.';document.getElementById('key').value='';document.getElementById('pass').value=''}catch(e){msg.textContent='خطا: '+e.message}}</script></body></html>
