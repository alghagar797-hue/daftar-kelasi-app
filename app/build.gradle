plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.classroom.daftar'
    compileSdk 36

    defaultConfig {
        applicationId 'com.classroom.daftar'
        minSdk 23
        targetSdk 36
        versionCode 18
        versionName '5.2.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            def storeFileProp = System.getenv('DAFTAR_KEYSTORE_FILE')
            def storePasswordProp = System.getenv('DAFTAR_KEYSTORE_PASSWORD')
            def keyAliasProp = System.getenv('DAFTAR_KEY_ALIAS')
            def keyPasswordProp = System.getenv('DAFTAR_KEY_PASSWORD')

            if (!storeFileProp || !storePasswordProp || !keyAliasProp || !keyPasswordProp) {
                throw new GradleException('Release signing credentials are missing. Configure the GitHub Actions secrets before building a release APK.')
            }

            def keystore = file(storeFileProp)
            if (!keystore.exists() || !keystore.isFile()) {
                throw new GradleException('Release keystore file does not exist: ' + storeFileProp)
            }

            storeFile keystore
            storePassword storePasswordProp
            keyAlias keyAliasProp
            keyPassword keyPasswordProp
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.webkit:webkit:1.13.0'
}
