plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.classroom.daftar'
    compileSdk 36

    defaultConfig {
        applicationId 'com.classroom.daftar'
        minSdk 23
        targetSdk 36
        versionCode 15
        versionName '4.5.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            def storeFileProp = System.getenv('DAFTAR_KEYSTORE_FILE')
            def storePasswordProp = System.getenv('DAFTAR_KEYSTORE_PASSWORD')
            def keyAliasProp = System.getenv('DAFTAR_KEY_ALIAS')
            def keyPasswordProp = System.getenv('DAFTAR_KEY_PASSWORD')

            if (!storeFileProp || !storePasswordProp || !keyAliasProp || !keyPasswordProp) {
                throw new GradleException(
                    'Release signing credentials are missing. The GitHub Actions workflow must provide DAFTAR_KEYSTORE_FILE, DAFTAR_KEYSTORE_PASSWORD, DAFTAR_KEY_ALIAS and DAFTAR_KEY_PASSWORD.'
                )
            }

            def keystore = file(storeFileProp)
            if (!keystore.exists() || !keystore.isFile()) {
                throw new GradleException('Release keystore file does not exist: ' + storeFileProp)
            }

            storeFile keystore
            storePassword storePasswordProp
            keyAlias keyAliasProp
            keyPassword keyPasswordProp
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
