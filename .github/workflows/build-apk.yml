name: Build Android Release APK v5.2.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate project
        shell: bash
        run: |
          set -e

          test -f app/build.gradle
          test -f app/src/main/assets/index.html

          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

          echo "Project validation successful."

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "Signing secrets OK."

      - name: Restore permanent signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          KEYSTORE_FILE="$RUNNER_TEMP/daftar-release-v2.keystore"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"

          chmod 600 "$KEYSTORE_FILE"

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Validate keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list \
          -keystore "$KEYSTORE_FILE" \
          -storepass "$KEYSTORE_PASSWORD" \
          -alias "$KEY_ALIAS"

      - name: Build release APK v5.2.1
        shell: bash
        env:
          DAFTAR_KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          DAFTAR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DAFTAR_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DAFTAR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |

          if [ -x "./gradlew" ]; then

            ./gradlew \
            --no-daemon \
            --stacktrace \
            --console=plain \
            :app:assembleRelease

          else

            gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            :app:assembleRelease

          fi


      - name: Find APK
        shell: bash
        run: |

          APK_PATH=$(find app/build/outputs/apk/release \
          -name "*.apk" \
          | head -n 1)

          test -f "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          ls -lh "$APK_PATH"


      - name: Verify APK signature
        shell: bash
        run: |

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
          -name apksigner \
          | sort -V \
          | tail -n 1)

          "$APKSIGNER" verify --verbose "$APK_PATH"


      - name: Prepare final APK
        shell: bash
        run: |

          mkdir -p release

          cp "$APK_PATH" \
          release/DaftarKelasi-v5.2.1.apk


      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:

          name: DaftarKelasi-APK-v5.2.1

          path: release/DaftarKelasi-v5.2.1.apk

          retention-days: 30


      - name: Cleanup signing key
        if: always()
        run: |

          rm -f "$RUNNER_TEMP/daftar-release-v2.keystore"

          echo "Cleanup completed."
