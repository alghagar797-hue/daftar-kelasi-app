name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. دریافت پروژه
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. نصب Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. آماده‌سازی Gradle
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # --------------------------------------------------
      # 4. بررسی فایل‌های ضروری پروژه
      # --------------------------------------------------
      - name: Validate project
        shell: bash
        run: |
          set -e

          echo "Checking project files..."

          test -f app/build.gradle
          test -f app/src/main/assets/index.html

          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found. System Gradle will be used."
          fi

          echo "Project validation successful."

      # --------------------------------------------------
      # 5. بررسی Secretهای امضا
      # --------------------------------------------------
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "Checking signing secrets..."

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          }

          echo "All signing secrets are available."

      # --------------------------------------------------
      # 6. بازیابی Keystore دائمی
      # --------------------------------------------------
      - name: Restore permanent signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          KEYSTORE_FILE="$RUNNER_TEMP/daftar-release-v2.keystore"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"

          chmod 600 "$KEYSTORE_FILE"

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          echo "Keystore restored successfully."

      # --------------------------------------------------
      # 7. بررسی Keystore
      # --------------------------------------------------
      - name: Validate keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          echo "Validating keystore..."

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Keystore validation successful."

      # --------------------------------------------------
      # 8. ساخت APK Release
      #
      # توجه:
      # اینجا عمداً Clean حذف شده است.
      # --------------------------------------------------
      - name: Build release APK
        shell: bash
        env:
          DAFTAR_KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          DAFTAR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DAFTAR_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DAFTAR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "Starting release APK build..."

          if [ -x "./gradlew" ]; then
            ./gradlew \
              --no-daemon \
              --stacktrace \
              --console=plain \
              :app:assembleRelease
          else
            gradle \
              --no-daemon \
              --stacktrace \
              --console=plain \
              :app:assembleRelease
          fi

          echo "Release APK build completed successfully."

      # --------------------------------------------------
      # 9. پیدا کردن APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_PATH="$(find app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          test -n "$APK_PATH"
          test -f "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo "APK found:"
          ls -lh "$APK_PATH"

      # --------------------------------------------------
      # 10. بررسی امضای APK
      # --------------------------------------------------
      - name: Verify APK signature
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          echo "Verifying APK signature..."

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)"

          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK_PATH"

          keytool \
            -printcert \
            -jarfile "$APK_PATH" \
            > "$RUNNER_TEMP/apk-cert.txt"

          echo "APK certificate:"
          cat "$RUNNER_TEMP/apk-cert.txt"

          echo "APK signature verification successful."

      # --------------------------------------------------
      # 11. مقایسه گواهی APK با Keystore
      # --------------------------------------------------
      - name: Compare APK certificate with release keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          echo "Comparing APK certificate with release keystore..."

          keytool \
            -exportcert \
            -rfc \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > "$RUNNER_TEMP/keystore-cert.pem"

          keytool \
            -printcert \
            -file "$RUNNER_TEMP/keystore-cert.pem" \
            > "$RUNNER_TEMP/keystore-cert.txt"

          APK_SHA256="$(
            grep 'SHA256:' "$RUNNER_TEMP/apk-cert.txt" \
            | head -n 1 \
            | tr -d ' ' \
            | cut -d: -f2-
          )"

          KEYSTORE_SHA256="$(
            grep 'SHA256:' "$RUNNER_TEMP/keystore-cert.txt" \
            | head -n 1 \
            | tr -d ' ' \
            | cut -d: -f2-
          )"

          echo "APK SHA-256:      $APK_SHA256"
          echo "Keystore SHA-256: $KEYSTORE_SHA256"

          test -n "$APK_SHA256"
          test -n "$KEYSTORE_SHA256"

          if [ "$APK_SHA256" != "$KEYSTORE_SHA256" ]; then
            echo "ERROR: APK certificate does not match release keystore."
            exit 1
          fi

          echo "Certificate verification successful."

      # --------------------------------------------------
      # 12. آماده‌سازی APK نهایی
      # --------------------------------------------------
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp "$APK_PATH" release/DaftarKelasi.apk

          test -f release/DaftarKelasi.apk

          echo "Final APK:"
          ls -lh release/DaftarKelasi.apk

      # --------------------------------------------------
      # 13. آپلود APK به عنوان Artifact
      # --------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaftarKelasi-APK-v4.5.3
          path: release/DaftarKelasi.apk
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 14. پاک کردن Keystore از Runner
      # --------------------------------------------------
      - name: Cleanup signing key
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/daftar-release-v2.keystore"

          echo "Signing keystore cleanup completed."
