name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create release signing key
        shell: bash
        run: |
          set -e

          KEYSTORE_PATH="$RUNNER_TEMP/daftar-release.keystore"
          KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          KEY_ALIAS="daftar-release"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_PATH" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Daftar Kelasi, OU=Android, O=Daftar Kelasi, L=Minab, ST=Hormozgan, C=IR"

          echo "RELEASE_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          echo "Found APK: $APK"

          echo "APK_SOURCE=$APK" >> "$GITHUB_ENV"

      - name: Sign Release APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)

          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          if [ ! -f "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          mkdir -p release

          echo "Aligning APK..."
          "$ZIPALIGN" -f -p 4 \
            "$APK_SOURCE" \
            release/DaftarKelasi-aligned.apk

          echo "Signing APK..."
          "$APKSIGNER" sign \
            --ks "$RELEASE_KEYSTORE" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass "pass:$RELEASE_KEYSTORE_PASSWORD" \
            --key-pass "pass:$RELEASE_KEY_PASSWORD" \
            --out release/DaftarKelasi.apk \
            release/DaftarKelasi-aligned.apk

          rm -f release/DaftarKelasi-aligned.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS/apksigner"

          "$APKSIGNER" verify --verbose release/DaftarKelasi.apk

          echo "APK signature verification successful."

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: DaftarKelasi-APK
          path: release/DaftarKelasi.apk
          if-no-files-found: error
          retention-days: 30
