name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          KEYSTORE_PATH="$RUNNER_TEMP/daftar-release-v2.keystore"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: Keystore was not restored."
            exit 1
          fi

          echo "Permanent release keystore restored."

      - name: Build signed Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          gradle --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/daftar-release-v2.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            :app:assembleRelease

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          echo "Found APK: $APK"
          echo "APK_SOURCE=$APK" >> "$GITHUB_ENV"

      - name: Prepare Android Build Tools
        shell: bash
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          echo "Verifying APK signature..."

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK_SOURCE"

          echo "========================================="
          echo "APK SIGNATURE VERIFIED SUCCESSFULLY"
          echo "========================================="

      - name: Copy final APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp "$APK_SOURCE" release/DaftarKelasi.apk

          echo "Final APK:"
          ls -lh release/DaftarKelasi.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: DaftarKelasi-APK-v4.5.1
          path: release/DaftarKelasi.apk
          if-no-files-found: error
          retention-days: 30
