name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. دریافت آخرین سورس
      # =========================================================
      - name: Checkout project
        uses: actions/checkout@v4

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # =========================================================
      # 3. Gradle 8.13
      # =========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # =========================================================
      # 4. بررسی وجود فایل‌های اصلی پروژه
      # =========================================================
      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail

          test -f "app/build.gradle" || {
            echo "ERROR: app/build.gradle not found."
            exit 1
          }

          test -f "app/src/main/AndroidManifest.xml" || {
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          }

          test -f "app/src/main/assets/index.html" || {
            echo "ERROR: index.html not found."
            exit 1
          }

          echo "Project structure OK."

      # =========================================================
      # 5. بررسی Secret ها
      # =========================================================
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          fi

          echo "All signing secrets are available."

      # =========================================================
      # 6. بازیابی کلید امضای دائمی
      # =========================================================
      - name: Restore permanent release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/daftar-release-v2.keystore"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          chmod 600 "$KEYSTORE_PATH"

          echo "Permanent release keystore restored."

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            >/dev/null

          echo "Keystore validation successful."

      # =========================================================
      # 7. پاک‌سازی Build قبلی
      # =========================================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon clean

      # =========================================================
      # 8. ساخت APK Release با همان کلید دائمی
      # =========================================================
      - name: Build signed Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/daftar-release-v2.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            :app:assembleRelease

      # =========================================================
      # 9. اطمینان از ساخته شدن APK درست
      # =========================================================
      - name: Validate generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Expected release APK was not generated."
            echo "Available APK files:"
            find . -type f -name "*.apk" -print
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK is empty."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

          echo "APK_SOURCE=$APK" >> "$GITHUB_ENV"

      # =========================================================
      # 10. آماده‌سازی Android Build Tools
      # =========================================================
      - name: Prepare Android Build Tools
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS=$(
            find "$ANDROID_HOME/build-tools" \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              | sort -V \
              | tail -n 1
          )

          if [ -z "$BUILD_TOOLS" ]; then
            echo "ERROR: Android Build Tools not found."
            exit 1
          fi

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

      # =========================================================
      # 11. بررسی امضای APK
      # =========================================================
      - name: Verify APK signature
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Verifying APK signature..."

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK_SOURCE"

          echo "APK signature verification successful."

      # =========================================================
      # 12. مقایسه گواهی APK با Keystore دائمی
      # =========================================================
      - name: Verify release certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          APK_CERT=$(
            "$BUILD_TOOLS/apksigner" verify \
              --print-certs \
              "$APK_SOURCE" 2>/dev/null \
              | grep "Signer #1 certificate SHA-256 digest" \
              | sed 's/.*: //'
          )

          KEYSTORE_CERT=$(
            keytool -list -v \
              -keystore "$RUNNER_TEMP/daftar-release-v2.keystore" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "${{ secrets.KEY_ALIAS }}" \
              2>/dev/null \
              | grep "SHA256:" \
              | head -n 1 \
              | sed 's/.*SHA256: //'
          )

          if [ -z "$APK_CERT" ] || [ -z "$KEYSTORE_CERT" ]; then
            echo "ERROR: Could not read signing certificate."
            exit 1
          fi

          echo "APK certificate:"
          echo "$APK_CERT"

          echo "Keystore certificate:"
          echo "$KEYSTORE_CERT"

          if [ "$APK_CERT" != "$KEYSTORE_CERT" ]; then
            echo "ERROR: APK was NOT signed with the permanent release certificate."
            exit 1
          fi

          echo "Permanent release certificate verified successfully."

      # =========================================================
      # 13. بررسی اطلاعات APK
      # =========================================================
      - name: Inspect APK
        shell: bash
        run: |
          set -euo pipefail

          "$BUILD_TOOLS/aapt" dump badging "$APK_SOURCE" | head -n 5

      # =========================================================
      # 14. ساخت فایل نهایی
      # =========================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp "$APK_SOURCE" release/DaftarKelasi.apk

          sha256sum release/DaftarKelasi.apk \
            | tee release/DaftarKelasi.apk.sha256

          echo "Final release files:"
          ls -lh release/

      # =========================================================
      # 15. آپلود APK
      # =========================================================
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: DaftarKelasi-APK-Release
          path: |
            release/DaftarKelasi.apk
            release/DaftarKelasi.apk.sha256
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 16. پاک‌سازی کلید از Runner
      # =========================================================
      - name: Cleanup signing key
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/daftar-release-v2.keystore"

          echo "Signing key cleanup completed."
