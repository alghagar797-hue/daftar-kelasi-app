name: Build Android Release APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
سطسزسزسزز
jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'


      - name: Check project
        run: |
          test -f app/build.gradle
          test -f app/src/main/assets/index.html
          test -f index.html
          # Keep the root web app as the single source of truth for the Android WebView.
          cp index.html app/src/main/assets/index.html
          cmp -s index.html app/src/main/assets/index.html
          echo "Project OK: Android asset synchronized from root index.html."


      - name: Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: GitHub Secret KEYSTORE_BASE64 is missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > daftar-release.keystore
          if [ ! -s daftar-release.keystore ]; then
            echo "ERROR: decoded keystore is empty or invalid."
            exit 1
          fi
          chmod 600 daftar-release.keystore
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/daftar-release.keystore" >> "$GITHUB_ENV"


      - name: Build Release APK
        env:
          DAFTAR_KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          DAFTAR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DAFTAR_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DAFTAR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |

          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi


      - name: Prepare APK
        run: |

          mkdir -p release

          cp app/build/outputs/apk/release/app-release.apk \
          release/DaftarKelasi.apk

          ls -lh release/


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DaftarKelasi-APK-v7.6
          path: release/DaftarKelasi.apk
          retention-days: 30


      - name: Cleanup
        if: always()
        run: |
          rm -f daftar-release.keystore
